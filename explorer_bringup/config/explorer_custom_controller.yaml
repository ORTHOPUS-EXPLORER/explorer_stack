controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    qontrol_explorer:
      type: qontrol_controller/QontrolVelocityController

    explorer_custom_controller:
      type: explorer_command_controllers/CustomController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: forward_command_controller/ForwardCommandController

explorer_custom_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    settings:
      joint_1: { 
        mode: "position",
        command_interface_names: ["effort", "position", "velocity"],
        state_interface_names: ["effort", "position", "velocity"],
        impedance_damping: 1.0,
        impedance_stiffness: 2.0,
        enable_limits: false,
        position_command_min: -0.2,
        position_command_max:  0.2,
        position_step_max: 0.0005,
        # ref_mult: 0.01,
      }
      joint_2: {
        mode: "position",
        command_interface_names: ["effort", "position", "velocity"],
        state_interface_names: ["effort", "position", "velocity"],
        impedance_damping: 1.5,
        impedance_stiffness: 2.5,
        enable_limits: false,
        position_command_min: -1.57,
        position_command_max: -0.78,
        position_step_max: 0.0005,
        # ref_mult: 0.01,
      }
      joint_3: {
        mode: "position",
        command_interface_names: ["effort", "position", "velocity"],
        state_interface_names: ["effort", "position", "velocity"],
        impedance_damping: 1.0,
        impedance_stiffness: 2.0,
        enable_limits: false,
        position_command_min: -0.78,
        position_command_max:  0.78,
        position_step_max: 0.0005,
        # ref_mult: 0.01,
      }
      joint_4: {
        mode: "position",
        command_interface_names: ["effort", "position", "velocity"],
        state_interface_names: ["effort", "position", "velocity"],
        impedance_damping: 0.5,
        impedance_stiffness: 1.0,
        enable_limits: false,
        position_command_min: -1.0,
        position_command_max:  1.0,
        position_step_max: 0.2,
        # position_command_init_value: 0.0,
        # ref_mult: 50.0,
      }
      joint_5: {
        mode: "position",
        command_interface_names: ["effort", "position", "velocity"],
        state_interface_names: ["effort", "position", "velocity"],
        impedance_damping: 0.7,
        impedance_stiffness: 0.8,
        enable_limits: false,
        position_command_min: -1.0,
        position_command_max:  1.0,
        position_step_max: 0.2,
        # position_command_init_value: 0.0,
        # ref_mult: 50.0,
      }
      joint_6: {
        mode: "position",
        command_interface_names: ["effort", "position", "velocity"],
        state_interface_names: ["effort", "position", "velocity"],
        impedance_damping: 0.2,
        impedance_stiffness: 0.3,
        enable_limits: false,
        position_command_min: -1.0,
        position_command_max:  1.0,
        position_step_max: 0.2,
        # position_command_init_value: 0.0,
        # ref_mult: 50.0,
      }

gripper_controller:
  ros__parameters:
    joints:
      - right_finger_joint
    interface_name: position

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

    command_interfaces:
      - position

    state_interfaces:
      - position

    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    open_loop_control: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      joint1:
        trajectory: 0.05
        goal: 0.03

qontrol_explorer:
  ros__parameters:
    # Base parameters
    robot_description_origin: robot_state_publisher
    tip_frame: tool0
    root_frame: base_link
    state_interface:
      - position
      - velocity
      - effort

    robot_command: qp_position
    chainable_controller_name: explorer_custom_controller

    # Velocity parameters
    command_max_linear_velocity: 0.03
    command_max_angular_velocity: 0.5
    input_topic_name: /explorer_user_interfaces/rqt_armcontrol/input_device_velocity
    regularisation_weight: 1e-3